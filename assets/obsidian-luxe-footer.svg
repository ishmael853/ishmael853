
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="230"
     viewBox="0 0 1200 230"
     role="img">

<title>Thank you for stopping by — Ishmael Mogwasi</title>

<defs>
  <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#07080B"/>
    <stop offset="55%" stop-color="#0C0E15"/>
    <stop offset="100%" stop-color="#080B16"/>
  </linearGradient>

  <linearGradient id="luxury" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#F1D6A0"/>
    <stop offset="40%" stop-color="#C69A55"/>
    <stop offset="72%" stop-color="#315EFF"/>
    <stop offset="100%" stop-color="#1738B8"/>
  </linearGradient>

  <linearGradient id="light" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#F4D9A5" stop-opacity="0"/>
    <stop offset="50%" stop-color="#FFF4D8" stop-opacity=".9"/>
    <stop offset="65%" stop-color="#6D8CFF" stop-opacity=".3"/>
    <stop offset="100%" stop-color="#315EFF" stop-opacity="0"/>
  </linearGradient>

  <radialGradient id="goldGlow">
    <stop offset="0%" stop-color="#D8B36D" stop-opacity=".25"/>
    <stop offset="100%" stop-color="#D8B36D" stop-opacity="0"/>
  </radialGradient>

  <radialGradient id="blueGlow">
    <stop offset="0%" stop-color="#285BFF" stop-opacity=".28"/>
    <stop offset="100%" stop-color="#285BFF" stop-opacity="0"/>
  </radialGradient>

  <filter id="blur">
    <feGaussianBlur stdDeviation="22"/>
  </filter>

  <style>
    .glint {
      animation: glide 10s ease-in-out infinite;
    }

    .ribbon {
      animation: breathe 8s ease-in-out infinite alternate;
      transform-origin: center;
    }

    @keyframes glide {
      0% {
        transform: translateX(-550px);
        opacity: 0;
      }
      15% { opacity: .7; }
      75% { opacity: .65; }
      100% {
        transform: translateX(1450px);
        opacity: 0;
      }
    }

    @keyframes breathe {
      from {
        transform: translateY(-4px) scaleY(.9);
        opacity: .6;
      }
      to {
        transform: translateY(5px) scaleY(1.1);
        opacity: 1;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .glint, .ribbon {
        animation: none;
      }
    }
  </style>
</defs>

<!-- Obsidian background -->
<rect width="1200" height="230" rx="18"
      fill="url(#background)"/>

<!-- Ambient gold and blue light -->
<ellipse cx="170" cy="20" rx="360" ry="160"
         fill="url(#goldGlow)"/>

<ellipse cx="1080" cy="225" rx="380" ry="180"
         fill="url(#blueGlow)"/>

<!-- Flowing ribbon -->
<path d="M-30 168 C190 65 335 225 545 136 S930 25 1230 112"
      fill="none"
      stroke="url(#luxury)"
      stroke-width="25"
      opacity=".18"
      filter="url(#blur)"
      class="ribbon"/>

<path d="M-30 168 C190 65 335 225 545 136 S930 25 1230 112"
      fill="none"
      stroke="url(#luxury)"
      stroke-width="2"
      opacity=".9"
      class="ribbon"/>

<!-- Moving light sweep -->
<g class="glint" filter="url(#blur)">
  <rect x="-100" y="0" width="200" height="230"
        fill="url(#light)"/>
</g>

<!-- Top gradient border -->
<rect width="1200" height="4" fill="url(#luxury)"/>

<!-- Footer typography -->
<text x="600" y="88"
      text-anchor="middle"
      fill="#F4F1EA"
      font-family="Arial, Helvetica, sans-serif"
      font-size="26"
      font-weight="700"
      letter-spacing="2">
  THANK YOU FOR STOPPING BY.
</text>

<text x="600" y="128"
      text-anchor="middle"
      fill="#C5C8D1"
      font-family="Arial, Helvetica, sans-serif"
      font-size="15">
  Thoughtful engineering. Purposeful design. Continuous progress.
</text>

<text x="600" y="184"
      text-anchor="middle"
      fill="#D9C39A"
      font-family="Arial, Helvetica, sans-serif"
      font-size="12"
      letter-spacing="4">
  ISHMAEL MOGWASI • OBSIDIAN LUXE
</text>

</svg>
